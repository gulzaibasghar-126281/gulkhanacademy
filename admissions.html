
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissions | Gulkahn Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">GULKAHN <span>ACADEMY</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="admissions.html">Admissions</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="page-banner">
    <h1>Student Admissions</h1>
    <p>Start your educational journey with us!</p>
</section>

<section class="form-section">
    <form class="main-form" action="#" method="post">

        <h2>Admission Application</h2>

        <label>Student Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Father's Name</label>
        <input type="text" placeholder="Enter father's name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter phone number" required>

        <label>Date of Birth</label>
        <input type="date" required>

        <label>Select Class</label>
        <select required>
            <option value="">Choose your class</option>
            <option>Class 6</option>
            <option>Class 7</option>
            <option>Class 8</option>
            <option>Class 9</option>
            <option>Class 10</option>
            <option>Intermediate</option>
        </select>

        <label>Previous School</label>
        <input type="text" placeholder="Previous school name">

        <label>Home Address</label>
        <textarea placeholder="Enter your address"></textarea>

        <button type="submit" class="btn">Submit Application</button>

    </form>
</section>

<footer>
    <p>© 2026 Gulkahn Academy. All Rights Reserved.</p>
</footer>

</body>
</html>
